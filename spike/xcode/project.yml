name: JuPrevSpike
options:
  bundleIdPrefix: ch.usi.kacper.juprevspike
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JuPrevSpike:
    type: application
    platform: macOS
    sources: [App]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ch.usi.kacper.juprevspike
    dependencies:
      - target: QLPreview
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write: [/Library/Application Support/JuPrevSpike/]
        com.apple.security.files.user-selected.read-only: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JuPrev Spike
        LSApplicationCategoryType: public.app-category.developer-tools
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.jupyter.ipynb
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo: [public.json, public.text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ipynb]
              public.mime-type: [application/x-ipynb+json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jupyter Notebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.jupyter.ipynb]
  QLPreview:
    type: app-extension
    platform: macOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ch.usi.kacper.juprevspike.preview
    sources:
      - QLPreview
      - path: ../renderer/dist/render.js
        buildPhase: resources
      - path: ../renderer/dist/style.css
        buildPhase: resources
    entitlements:
      path: QLPreview/QLPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only: ["/"]
    info:
      path: QLPreview/Info.plist
      properties:
        CFBundleDisplayName: JuPrev Spike Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [org.jupyter.ipynb]
